name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The committed data/ must match what sync produces for the pinned tags,
      # and the built system must pass the format and contrast checks.
      - name: Sync is reproducible
        run: |
          node scripts/sync.mjs
          git diff --exit-code -- data/
      - name: Build and validate
        run: |
          node scripts/build.mjs
          node scripts/validate.mjs
